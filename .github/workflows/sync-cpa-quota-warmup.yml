name: Sync CPA Quota Warmup

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: sync-cpa-quota-warmup
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Sync the latest upstream release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/sync_cpa_quota_warmup.py

      - name: Validate the registry and artifacts
        run: |
          python3 scripts/validate-registry.py registry.json
          python3 scripts/check-registry-artifacts.py registry.json \
            --artifacts-dir artifacts \
            --url-prefix https://raw.githubusercontent.com/RayenAlex/cpa-plugin/main/artifacts
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Commit an upstream release update
        run: |
          if git diff --quiet -- registry.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry.json
          git commit -m "chore: sync cpa quota warmup release"
          git push
